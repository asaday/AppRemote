<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>App Remote</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; }
    #screen, #video { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #video { position: absolute; inset: 0; display: none; }
    #message { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; color: white; background: #000; text-align: center; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
    #message.hidden { display: none; }
    #notice { position: fixed; left: 1rem; right: 1rem; bottom: 1rem; padding: .7rem 1rem; border-radius: .5rem; background: #233248; color: white; text-align: center; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
    #notice.hidden { display: none; }
    #keyboard { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
    #remoteCursor { display: none; position: fixed; z-index: 2; width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 0 1px black; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body>
  <img id="screen" alt="Selected window" draggable="false">
  <video id="video" autoplay muted playsinline></video>
  <div id="message">Connecting...</div>
  <div id="notice" class="hidden" role="status"></div>
  <div id="remoteCursor" aria-hidden="true"></div>
  <input id="keyboard" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Remote text input">
  <script src="/app.js?v=1.1.1"></script>
</body>
</html>
